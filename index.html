<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Project Happiness</title>
  <meta name="description" content="One quiet place for the day: sit, come back, notice the pull, be there, and write a line.">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Happiness">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Kalam:wght@300;400&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
  </script>
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('ph2:core') || 'null');
      t = t && t.prefs && t.prefs.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <main id="view" class="view">
    <noscript><p class="card">Project Happiness needs JavaScript turned on.</p></noscript>
  </main>

  <nav class="tabs" aria-label="Main">
    <a href="#/today" data-route="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h18M6.5 17a5.5 5.5 0 0 1 11 0M12 5v2.5M4.6 9.6l1.8 1.8M19.4 9.6l-1.8 1.8"/></svg>
      <span>Today</span>
    </a>
    <a href="#/sit" data-route="sit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6.5" r="2.5"/><path d="M12 9.5c-3 0-4.5 2.5-4.5 5.5M12 9.5c3 0 4.5 2.5 4.5 5.5M4.5 18.5c2-2.5 13-2.5 15 0"/></svg>
      <span>Sit</span>
    </a>
    <a href="#/pause" data-route="pause" class="tab-pause" aria-label="Pause: caught yourself reaching?">
      <span class="pause-fab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/></svg></span>
      <span>Pause</span>
    </a>
    <a href="#/path" data-route="path">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20c0-4 3-4 3-7s-3-3-3-6 3-4 6-4M19 20c0-3-3-4-3-7s3-4 0-7"/></svg>
      <span>Path</span>
    </a>
    <a href="#/book" data-route="book">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      <span>Book</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="overlay" class="overlay"></div>
  <div id="stage" class="stage" hidden></div>

  <script src="vendor/samples/manifest.js"></script>
  <script src="vendor/instruments.js"></script>
  <script src="vendor/tones.js"></script>
  <script>if (window.Lab) Lab.sampleBase = 'vendor/samples/';</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
